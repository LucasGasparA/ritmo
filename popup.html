<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ritmo</title>
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon32.png" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <div class="brand">
          <span class="brand-mark"><img src="icons/icon32.png" alt="" /></span>
          <span>ritmo</span>
        </div>
        <button class="icon-button" id="refreshButton" title="Atualizar" aria-label="Atualizar">
          <svg viewBox="0 0 24 24"><path d="M20 6v5h-5"/><path d="M4 18v-5h5"/><path d="M6.1 9A7 7 0 0 1 18.4 6.4L20 11M4 13l1.6 4.6A7 7 0 0 0 17.9 15"/></svg>
        </button>
      </header>

      <section id="loadingState" class="state-view">
        <span class="loader"></span>
        <p>Carregando sua semana…</p>
      </section>

      <section id="disconnectedState" class="state-view" hidden>
        <span class="calendar-illustration">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>
        </span>
        <h1>Conecte seu Google Agenda</h1>
        <p>Veja como seu tempo está distribuído e quanto ainda cabe na semana.</p>
        <button class="primary-button" id="connectButton">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20c5.5 0 9.2-3.9 9.2-9.4 0-.7-.1-1.2-.2-1.7h-9v3.6h5.2a4.5 4.5 0 0 1-2 2.9v2.4h3.2A9.7 9.7 0 0 0 22 12C22 6.5 17.5 2 12 2Z"/></svg>
          Conectar Google Agenda
        </button>
        <small>Acesso somente para leitura</small>
      </section>

      <section id="summaryState" hidden>
        <div class="week-heading">
          <div><span>ESTA SEMANA</span><h1 id="weekPeriod"></h1></div>
          <span class="connected-badge"><i></i>Conectado</span>
        </div>

        <div class="summary-card">
          <div class="ring-wrap">
            <svg class="progress-ring" viewBox="0 0 112 112">
              <circle class="ring-track" cx="56" cy="56" r="45"/>
              <circle class="ring-value" id="capacityRing" cx="56" cy="56" r="45"/>
            </svg>
            <div class="ring-label"><strong id="totalHours">0h</strong><span>ocupadas</span></div>
          </div>
          <div class="capacity-copy">
            <span>Espaço disponível</span>
            <strong id="freeHours">0h</strong>
            <small>de <b id="capacityHours">40h</b> semanais</small>
          </div>
        </div>

        <div class="mini-kpis">
          <div><span class="kpi-icon meeting"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 10h18"/></svg></span><p>Reuniões<strong id="meetingHours">0h</strong></p></div>
          <div><span class="kpi-icon alert"><svg viewBox="0 0 24 24"><path d="M10.3 3.6 2.2 18a2 2 0 0 0 1.7 3h16.2a2 2 0 0 0 1.7-3L13.7 3.6a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/></svg></span><p>Imprevistos<strong id="unexpectedHours">0h</strong></p></div>
        </div>

        <div class="category-block">
          <div class="section-title"><span>MAIORES CATEGORIAS</span><b id="eventCount">0 eventos</b></div>
          <div id="categoryList" class="category-list"></div>
        </div>

        <p class="sync-time" id="syncTime"></p>
      </section>

      <footer>
        <button class="details-button" id="openDashboardButton">Abrir análise completa <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
      </footer>
      <div class="error-message" id="errorMessage" hidden></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
